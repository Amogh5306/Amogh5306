<svg width="600" height="230" viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;display=swap');
      .prompt { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #00D9FF; font-weight: 600; }
      .cmd { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #fafafa; }
      .file { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #aaaaaa; }
      .output { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #fafafa; opacity: 0.85; }
      .bold { font-weight: 600; fill: #00D9FF; font-size: 14px; }
      .bg { fill: #0D1117; }
      .border { fill: none; stroke: #333333; stroke-width: 1; }
      .cursor { fill: #00D9FF; font-family: 'JetBrains Mono', monospace; font-size: 14px; animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .type-mask { fill: #0D1117; animation: slide 1.5s steps(40, end) forwards; }
      .type-mask-1 { animation-delay: 0.5s; }
      .type-mask-2 { animation-delay: 1.5s; }
      .type-mask-3 { animation-delay: 2.0s; }
      .type-mask-4 { animation-delay: 3.0s; }
      .type-mask-5 { animation-delay: 3.2s; }
      .type-mask-6 { animation-delay: 4.5s; }
      .type-mask-7 { animation-delay: 5.5s; }
      @keyframes slide { to { transform: translateX(550px); } }
      .hide { opacity: 0; animation: fadein 0.1s forwards; }
      .delay-1 { animation-delay: 0s; }
      .delay-2 { animation-delay: 1.5s; }
      .delay-3 { animation-delay: 2.0s; }
      .delay-4 { animation-delay: 3.0s; }
      .delay-6 { animation-delay: 4.5s; }
      .delay-7 { animation-delay: 5.5s; }
      .delay-8 { animation-delay: 7.0s; }
      @keyframes fadein { to { opacity: 1; } }
    </style>
  </defs>

  <!-- Main -->
  <rect x="0" y="0" width="600" height="230" class="bg" rx="6" />
  <rect x="0" y="0" width="600" height="230" class="border" rx="6" />
  
  <g transform="translate(15, 15)">
    <circle cx="0" cy="0" r="6" fill="#ff5f57" />
    <circle cx="20" cy="0" r="6" fill="#febc2e" />
    <circle cx="40" cy="0" r="6" fill="#28c840" />
  </g>

  <!-- Block 1 -->
  <g class="hide delay-1">
    <text y="60" x="20">
      <tspan class="prompt">~$</tspan>
      <tspan class="cmd"> cat</tspan>
      <tspan class="file"> about.txt</tspan>
    </text>
    <rect x="40" y="45" width="550" height="20" class="type-mask type-mask-1" />
  </g>
  
  <g class="hide delay-2">
    <text y="85" x="20" class="output">&gt; Engineering Student @ <tspan class="bold">Amrita Vishwa Vidyapeetham</tspan></text>
  </g>

  <!-- Block 2 -->
  <g class="hide delay-3">
    <text y="120" x="20">
      <tspan class="prompt">~$</tspan>
      <tspan class="cmd"> cat</tspan>
      <tspan class="file"> focus.txt</tspan>
    </text>
    <rect x="40" y="105" width="550" height="20" class="type-mask type-mask-3" />
  </g>
  
  <g class="hide delay-4">
    <text y="145" x="20" class="output">&gt; Building scalable data pipelines and <tspan class="bold">premium UIs</tspan></text>
  </g>

  <!-- Block 3 -->
  <g class="hide delay-6">
    <text y="180" x="20">
      <tspan class="prompt">~$</tspan>
      <tspan class="cmd"> cat</tspan>
      <tspan class="file"> interests.txt</tspan>
    </text>
    <rect x="40" y="165" width="550" height="20" class="type-mask type-mask-6" />
  </g>

  <g class="hide delay-7">
    <text y="205" x="20" class="output">&gt; <tspan class="bold">Web Dev</tspan>, <tspan class="bold">Data Engineering</tspan>, UI/UX, Automation</text>
  </g>

  <g class="hide delay-8">
     <text y="235" x="20" class="prompt">~$ <tspan class="cursor">█</tspan></text>
  </g>
</svg>
